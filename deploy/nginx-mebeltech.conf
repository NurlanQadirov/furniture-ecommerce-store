# Müvəqqəti :8083 — domeni olanda `listen 80;` + `server_name mebeltech-domeni`
# yaz, `default_server` YAZMA (o 000-catchall-dadır).
#
#   sudo cp deploy/nginx-mebeltech.conf /etc/nginx/sites-available/mebeltech
#   sudo ln -sf /etc/nginx/sites-available/mebeltech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8083;
    listen [::]:8083;
    server_name _;

    # Admin panelindən şəkil yüklənməsi 8 MB-a qədərdir.
    client_max_body_size 12M;

    # Build-dən çıxan statik fayllar — hash-li adlar, əbədi keş
    location /_next/static/ {
        alias /srv/apps/mebeltech/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Admin panelindən yüklənənlər: diskdən oxu, tapılmasa Next route-una ötür
    location /uploads/ {
        alias /srv/apps/mebeltech/public/uploads/;
        try_files $uri @app;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location @app {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
